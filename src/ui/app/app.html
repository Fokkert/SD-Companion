<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      SD Companion
    </title>
    <link rel="stylesheet" href="../common/theme.css">
    <link rel="stylesheet" href="../common/components.css">
    <link rel="stylesheet" href="app.css">
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar glass">
        <button id="homeBrand" class="brand-button">
          <img src="../../../icons/icon48.png">
          <span>
            <strong>
              SD Companion V2
            </strong>
          </span>
        </button>
        <div class="top-actions">
          <span id="apiBadge" class="pill info">
            API
          </span>
          <button id="refreshUi" class="icon-btn refresh-ui-top" data-action="refresh-ui" title="Reload extension state" aria-label="Reload extension state">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18.6 6.2A8 8 0 1 0 20 14"/>
              <path d="M18.5 3.5v4.8h-4.8"/>
            </svg>
          </button>
          <button id="quickStopAlarm" class="icon-btn alarm-stop-top" data-action="stop-alarm" title="Stop current and scheduled alarms" aria-label="Stop current and scheduled alarms">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 8.5a5 5 0 0 1 10 0c0 5 2 5.5 2 7.5H5c0-2 2-2.5 2-7.5Z"/>
              <path d="M10 19h4"/>
              <path d="m4 4 16 16"/>
            </svg>
          </button>
        </div>
      </header>
      <section class="context-bar glass">
        <div class="context-field context-section server-field">
          <span class="context-label">Server</span>
          <div class="context-selection-row">
            <span id="serverAvatar" class="context-avatar server-avatar">SD</span>
            <div class="context-select-wrap">
              <select id="serverSelect" class="select compact-select"></select>
            </div>
          </div>
        </div>
        <div class="context-field context-section profile-field">
          <span class="context-label">Profile</span>
          <div class="context-selection-row">
            <span class="context-avatar profile-context-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"></circle><path d="M5.5 19c.8-4 3.1-6 6.5-6s5.7 2 6.5 6"></path></svg>
            </span>
            <div class="context-select-wrap">
              <select id="profileSelect" class="select compact-select"></select>
            </div>
          </div>
        </div>
      </section>
      <main id="pageHost" class="page-host">
      </main>
      <nav class="bottom-nav glass">
        <button data-nav="home" aria-label="Home">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 11.5 12 4l9 7.5"/>
            <path d="M5.5 10.5V20h13v-9.5"/>
            <path d="M9.5 20v-6h5v6"/>
          </svg>
          <span>
            Home
          </span>
        </button>
        <button data-nav="servers" aria-label="Servers">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="3.5" width="16" height="6" rx="2"/>
            <rect x="4" y="14.5" width="16" height="6" rx="2"/>
            <path d="M8 6.5h.01M8 17.5h.01M12 6.5h5M12 17.5h5"/>
          </svg>
          <span>
            Servers
          </span>
        </button>
        <button data-nav="rules" aria-label="Rules">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 5h5M14 5h5M8 5v6a3 3 0 0 0 3 3h2a3 3 0 0 1 3 3v2"/>
            <circle cx="5" cy="5" r="2"/>
            <circle cx="19" cy="5" r="2"/>
            <circle cx="16" cy="19" r="2"/>
          </svg>
          <span>
            Rules
          </span>
        </button>
        <button data-nav="data" aria-label="Data">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <ellipse cx="12" cy="5" rx="7" ry="3"/>
            <path d="M5 5v6c0 1.7 3.1 3 7 3s7-1.3 7-3V5"/>
            <path d="M5 11v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>
          </svg>
          <span>
            Data
          </span>
        </button>
        <button data-nav="settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.1A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.1A1.7 1.7 0 0 0 15.4 4a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.38.25.72.6 1 1 .24.33.4.72.4 1.1v.1h.2v1.6h-.2v.1c0 .38-.16.77-.4 1.1-.28.4-.62.75-1 1Z"/>
          </svg>
          <span>
            Settings
          </span>
        </button>
      </nav>
      <div id="securityLockOverlay" class="security-lock-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="securityLockTitle">
        <div class="security-lock-card glass">
          <img src="../../../icons/icon64.png" class="security-lock-logo" alt="">
          <div class="security-lock-kicker">
            SD COMPANION V2
          </div>
          <h2 id="securityLockTitle">
            Extension locked
          </h2>
          <p id="securityLockHint" class="muted">
            Enter your password to continue.
          </p>
          <div class="field">
            <label id="securityUnlockLabel" for="securityUnlockInput">
              Password
            </label>
            <input id="securityUnlockInput" class="input security-secret-input" type="password" autocomplete="current-password" maxlength="128">
          </div>
          <div id="securityUnlockError" class="security-auth-error" aria-live="polite">
          </div>
          <button class="btn btn-primary security-unlock-btn" data-action="unlock-extension" type="button">
            Unlock
          </button>
        </div>
      </div>
      <div id="securityReauthOverlay" class="security-reauth-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="securityReauthTitle">
        <div class="security-reauth-card glass">
          <div class="security-lock-kicker">
            SECURITY CHECK
          </div>
          <h3 id="securityReauthTitle">
            Confirm sensitive action
          </h3>
          <p id="securityReauthHint" class="muted">
            Re-enter your password to continue.
          </p>
          <div class="field">
            <label id="securityReauthLabel" for="securityReauthInput">
              Password
            </label>
            <input id="securityReauthInput" class="input security-secret-input" type="password" autocomplete="current-password" maxlength="128">
          </div>
          <div id="securityReauthError" class="security-auth-error" aria-live="polite">
          </div>
          <div class="row security-reauth-actions">
            <button class="btn btn-primary" data-action="confirm-security-reauth" type="button">
              Confirm
            </button>
            <button class="btn" data-action="cancel-security-reauth" type="button">
              Cancel
            </button>
          </div>
        </div>
      </div>
      <div id="operationOverlay" class="operation-overlay hidden">
        <div class="operation-card glass">
          <div class="loader-ring">
          </div>
          <div class="operation-copy">
            <strong id="operationTitle">
              Working…
            </strong>
            <div id="operationDetail" class="muted">
              Working…
            </div>
          </div>
          <button id="cancelOperation" class="btn btn-danger btn-small" type="button">
            Cancel
          </button>
        </div>
      </div>
      <div id="toastHost" class="toast-host">
      </div>
      <input id="importFile" type="file" accept="application/json" hidden>
    </div>
    <script src="../../shared/alarm-catalog.js">
    </script>
    <script src="../../shared/constants.js">
    </script>
    <script src="../../shared/utils.js">
    </script>
    <script src="../../shared/schedule.js">
    </script>
    <script src="../../shared/condition-registry.js">
    </script>
    <script src="../../shared/rule-query.js">
    </script>
    <script src="../../shared/defaults.js">
    </script>
    <script src="../../shared/validators.js">
    </script>
    <script src="app-core.js">
    </script>
    <script src="soft-select.js">
    </script>
    <script src="pages/base.js">
    </script>
    <script src="pages/home.js">
    </script>
    <script src="pages/servers.js">
    </script>
    <script src="pages/data.js">
    </script>
    <script src="rule-context.js">
    </script>
    <script src="pages/rule-conditions.js">
    </script>
    <script src="pages/rule-actions.js">
    </script>
    <script src="pages/bulk-operations.js">
    </script>
    <script src="pages/rules.js">
    </script>
    <script src="pages/schedules.js">
    </script>
    <script src="pages/profiles.js">
    </script>
    <script src="pages/health.js">
    </script>
    <script src="pages/appearance.js">
    </script>
    <script src="pages/alarms.js">
    </script>
    <script src="pages/logs-more.js">
    </script>
    <script src="pages/help.js">
    </script>
    <script src="app-pages.js">
    </script>
    <script src="app-events.js">
    </script>
    <script src="app-main.js">
    </script>
  </body>
</html>
